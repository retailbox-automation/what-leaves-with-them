[project]
name = "honest-memory"
version = "0.0.1"
description = "Agent memory on FalkorDB that checks every write before it becomes a fact."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["honest_memory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
